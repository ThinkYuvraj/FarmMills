# ==============================================================================
# Farmers Mill - Production Nginx Configuration for 10,000+ Concurrent Clients
# ==============================================================================

# Run as high-throughput non-privileged user
user www-data;
pid /run/nginx.pid;

# 1 worker per CPU core
worker_processes auto;

# Maximum open file descriptors per worker process (vital for 10k connections)
worker_rlimit_nofile 65535;

events {
    # Number of simultaneous connections that can be opened by a worker process
    worker_connections 20480;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Timeouts for high concurrency
    keepalive_timeout 65s;
    keepalive_requests 10000;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 15s;
    reset_timedout_connection on;

    # Buffer size optimizations to prevent disk buffering
    client_body_buffer_size 128k;
    client_max_body_size 16M;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Rate limiting zones to protect application against denial of service
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=10r/s;

    # Fast Micro-cache zone for catalog and location endpoints (absorbs 90% of traffic)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=farmers_cache:20m max_size=1g inactive=10m use_temp_path=off;

    # Gzip Compression (reduces payload by ~75% for JSON and static files)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Upstream Node.js application cluster (PM2 on port 3000)
    upstream farmers_mill_cluster {
        # Keepalive connection pool between Nginx and Node.js instances
        keepalive 1024;
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name farmersmill.in www.farmersmill.in;

        # Redirect all HTTP to HTTPS in production
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name farmersmill.in www.farmersmill.in;

        # SSL Configuration (Let's Encrypt / Hostinger SSL)
        ssl_certificate /etc/letsencrypt/live/farmersmill.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/farmersmill.in/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Root directory for static production bundle
        root /var/www/farmers-mill/dist;
        index index.html;

        # Static assets cache with 1-year immutability (served directly by Nginx)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # Images & Media cache
        location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff2|woff|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
            try_files $uri =404;
        }

        # Catalog API Micro-Cache (absorbs 10,000 users refreshing simultaneously)
        location ~ ^/api/(products|location/detect|pincodes/schedule) {
            proxy_cache farmers_cache;
            proxy_cache_valid 200 15s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://farmers_mill_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Sensitive Auth Endpoints (Rate Limited)
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://farmers_mill_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Payment & Orders Endpoints
        location ~ ^/api/(payments|orders) {
            limit_req zone=payment_limit burst=20 nodelay;

            proxy_pass http://farmers_mill_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General API Endpoints
        location /api/ {
            limit_req zone=general_limit burst=50 nodelay;

            proxy_pass http://farmers_mill_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA Fallback: Serve index.html for all client routes
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
